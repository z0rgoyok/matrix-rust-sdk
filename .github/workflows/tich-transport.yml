name: Tich Connect transport
on:
  pull_request:
    branches: [tich/main]
  push:
    branches: [tich/main]
permissions:
  contents: read
jobs:
  transport:
    runs-on: ubuntu-latest
    env:
      CARGO_PROFILE_TEST_DEBUG: 0
      CARGO_BUILD_JOBS: 4
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.98.0
      - run: cargo test --locked -p matrix-sdk --lib --features tich-connect-transport http_client::tich_connect::tests
